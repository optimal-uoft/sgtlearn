[build-system]
requires = ["scikit-build-core>=0.9", "ninja", "pybind11", "pybind11-stubgen"]
build-backend = "scikit_build_core.build"

[project]
name = "sgtlearn"
version = "0.1.0"
description = "Shape Generalized Trees learning library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.scikit-build]
cmake.source-dir = "cpp"
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["sgtlearn"]
cmake.args = ["-DSGTLEARN_BUILD_TESTS=OFF"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]



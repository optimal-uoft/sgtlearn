[build-system]
requires = ["scikit-build-core>=0.9", "pybind11", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "sgtlearn"
version = "0.1.0"
description = "Shape Generalized Trees learning library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nakul Upadhaya", email = "nakulupadhya1@gmail.com" },{ name = "Joshua Lee", email = "joshua.lee.9880@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.20",
  "scikit-learn>=1.3",
   "joblib>=1.2"
]

[project.optional-dependencies]
dev = ["pytest>=7", "pybind11-stubgen"]

[tool.scikit-build]
cmake.source-dir = "cpp"
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["sgtlearn"]
cmake.args = ["-DSGTLEARN_BUILD_TESTS=OFF"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = [
  "sklearn",
  "sklearn.*",
  "ShapeGeneralizedTrees",
  "ShapeGeneralizedTrees.*",
]
ignore_missing_imports = true


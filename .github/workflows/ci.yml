name: CI

on:
  push:
    branches: ["**"]

  pull_request:
    branches: ["**"]

jobs:
  cpp_build_and_test:
    name: Build & Test C++
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libopenblas-dev
          pip install numpy

      - name: Configure CMake
        working-directory: cpp
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$(which python3)"

      - name: Build project
        working-directory: cpp
        run: cmake --build build

      - name: Run unit tests
        working-directory: cpp/build
        run: ctest --output-on-failure
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff black
      - run: ruff check sgtlearn/
      - run: black --check sgtlearn/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install mypy
      - run: mypy sgtlearn/

  python_layer_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Install scikit-learn 1.8+ for exact tree fidelity (3.11+)
        if: matrix.python-version != '3.10'
        run: pip install "scikit-learn>=1.8"
      - run: pytest -v

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install build
      - run: python -m build